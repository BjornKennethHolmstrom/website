      - "structured blindness: a coherent causal subspace sacrificed whole under capacity starvation"
      - "non-unique, symmetry-broken selection at the capacity margin"
      - behaviorally-equivalent classes -> coordination is selection within a class, not discovery of truth
      - causal-variable-preserving classes objectively better (robustness, sample efficiency, transfer)
