  - id: "XXVIII"
    title: Closure Adaptation Dynamics
    cluster: cycle-two          # late addition (cf. XII's One/Two tag). Content is cycle-two's: trust ~ XIII legitimacy, exploration ~ XIV, slow permeability loop mechanizes XV. Not limits (no adversarial multi-model protocol, positive results, design recommendation); not factorization (no bounded-representation content, not preregistered).
    status: draft
    question: What happens when the boundary is driven by felt uncertainty and its quality (permeability), not only its strength, can degrade under stress?
    depends_on: ["-XII", "~XV", "~XVI", "~XVIII", "~I", "~X"]
    establishes:
      - "five-variable model (U, B, T, E, P); boundary strength B separated from boundary permeability P; suppression block Q = (1-P)B"
      - "bistability: same environment supports open and closed attractors; strong bistability ~32-33% of a 20x20 (s, theta) grid, weak ~57-59%, across rho_P in {0.01..0.10}"
      - "hysteresis: collapse and recovery thresholds differ (institutional scarring)"
      - "slow permeability buffers transient perceptual noise; residual noise-induced tipping at high stakes + high noise (<=10% of 30 runs)"
      - "two populations coupled only through shared U: stable polarization; cascade collapse of an unshocked population"
      - "constitutional permeability floor: for the tested combined shock, P_min >= 0.4 recovers, P_min <= 0.3 locks closed (threshold in (0.3, 0.4))"
    formal_tier: [N]           # deterministic Euler sweeps + 30-run stochastic cells; NOT preregistered, no committed nulls — falls short of the N definition as written. Fast-slow analysis in §3 is qualitative, not a theorem.
    governance_tier: IP        # some readings self-labelled H (§8.2)
    evidence:
      - "Euler dt=0.05 with clipping to [0,1]; phase grid 20x20 x 4 rho_P from two initial conditions; stochastic 30 seeds per (s, sigma) cell; one shock profile for cascade and floor experiments"
      - "2026-11-08 spot re-simulation reproduced the open state at s=1.5 exactly (U 0.339, B 0.147, T 1.0, E 0.179, P 0.698)"
    nulls: []                  # none registered
    so_links: [SO-L6]
    corrections:
      - "OPEN — F_open: §3.3 states F_open ~ 0.077; re-simulation gives 0.108 at s=1.5 (still below theta_P = 0.15, so the argument holds; P ~ 0.70 is consistent with 0.108, not 0.077)."
      - "OPEN — closed attractor: §3.1.1 gives (B,T,E,U) ~ (1,0,0,1) and F_closed = s/(1+mu) ~ 0.528. Re-simulation from the closed start at s=1.5 gives U 0.81, T 0.03, E 0.05, F 0.39 — E is not driven to zero, so U does not reach 1. Qualitative conclusion unchanged (F stays above theta); the stated fixed point and F value need correcting."
      - "OPEN — Table 4.2: reported mean hysteresis widths (0.22-0.29) do not equal mean collapse s minus mean recovery s (0.023, 0.023, 0.008, -0.002); at rho_P=0.10 the difference of means is negative. Likely the widths average over bistable theta rows only while the means do not — state the definition or fix."
      - "OPEN — abstract and §7 say the floor 'guarantees' recovery; evidence is one deterministic shock profile. Narrow to 'for the tested shock'."
      - "MINOR — sigma used both for the logistic sigmoid and the noise intensity (§5.1)."
    unresolved:
      - "trust T overlaps XIII's legitimacy (endogenous coupling state, hysteresis) without citing it; relate or distinguish. Stronger now that XXVIII sits in cycle two beside XIII."
      - "SO-L6: exploration reduces actual uncertainty frictionlessly (alpha*E*U); SO-WP1 shows learning is exposure-gated and lagged. Gate the term by exposure."
      - "SO-L6: the permeability floor is evaluated without a price. Test it under no-shock conditions and against a matched comparator (SO-WP0: a safety-looking reserve floor lost by delaying needed protection)."
      - "§8.3 own list: analytic separatrix/critical floor, parameter sensitivity of P_min*, direct coupling, networks, adaptive floors, operationalisation, historical hysteresis, synthesis with XVIII."
    successors:
      - "fear-driven + learning-driven boundary synthesis (XVIII)"
      - "objective-driven closure (SO-WP1 exposure trap) as a third route alongside fear (XXVIII) and learning (XVIII)"

