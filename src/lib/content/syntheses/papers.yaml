# ---- Companion series: Systemic Optimization (SO) ----
#
# SO evidence statuses: C = confirmatory (prespecified test on sealed worlds);
# PD = prespecified descriptive; ED = exploratory, declared; EP = exploratory,
# post hoc; ST = structural (exact property of the model). All SO results are
# synthetic and within-model. Mapping to atlas tiers: ST -> [R] scope: the SO
# model; C -> [N]; PD/ED/EP -> [N] marked exploratory.

companion_papers:

  - id: SO-WP0
    title: "What Should We Optimize, and What Must We Know?"
    series: Systemic Optimization — Working Paper 0
    status: draft              # v0.2, 4 Nov 2026, revised after technical audit
    establishes:
      - "four inadequacies kept apart: objective, model, goal-information, learning/adaptation"
      - "A1 [C]: wetland objective substitutes for a BUNDLED structural omission (DiD 0.343 of narrow regret); no reliable hedge against unknown-direction parameter error (inconclusive)"
      - "A1 [C]: ambiguity aversion recovers 0.831 under wetter shift at exact parameters; weakens with parameter error, reverses under drier shift; shift lies outside its ambiguity ball"
      - "A1 [ED, post-G5]: 'value of acting after a shock' rewards unfinished protective work"
      - "A1 [ED]: no tested programme pair both mutually beneficial (strict 9-account) and synergistic"
      - "B [C]: reachability/diversity rank states well (HB3, rho ~0.73) but no measure passes the joint HB1 test against premium-matched reserves (measurement-objective separation)"
      - "B [ED]: uniform belief over the exact goal support recovers 0.69"
      - "B5 [C]: support knowledge 0.591 (inconclusive vs 0.5); period-displacing polling ~0 (refuted)"
      - "B5 [ED]: concurrent polling 0.209 free / 0.105 at cost 0.075"
    nulls: ["H1' wetland hedge inconclusive", "F1-eq (equity term) negligible", "HB1 failed for all four measures", "H5-2 refuted; H5-3 inconclusive"]

  - id: SO-WP1
    title: "What If the Model Is Incomplete?"
    series: Systemic Optimization — Working Paper 1 (programme id A2)
    status: draft              # v0.2, 6 Nov 2026, for text audit
    establishes:
      - "[C] re-model (REP: F0 on retention-assuming model) has lower mean U1 than re-value (COMP: ecological objective on retention-omitting model): -1.112 [-1.737, -0.487], n=40; precision target missed"
      - "[C] COMP better on wetland deficit and terminal stock; [C-derived] neither uniformly preferable"
      - "[PD] ecological objective nearly insensitive to omitting retention (+0.014 vs +1.851) but pays +1.085 U1 when the model is right ('robustness is a purchase')"
      - "[ED] REP advantage nearly vanishes under parameter error; which omission matters depends on what else is wrong"
      - "[ST] no upstream wetland -> R/S transitions identical; [ED] 7 exact exposure traps — a passive policy maintains its own blind spot"
      - "[ED] exact probe-then-commit learner: best kappa 0.107/0.179 of fixed-probe oracle margin; gains from state-contingent commitment, not belief updating"
      - "[IP] unit of evaluation is the package: what is represented, optimised, and observable under the resulting policy"
    nulls: ["REP's advantage fragile (10/40 reverse; parameter error)", "MIX heuristic beats both pure plans on U1", "learner screen kappa>=0.5 met in 0/9", "two verification gates rejected correct code"]

