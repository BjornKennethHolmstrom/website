  - id: "XXVI"
    title: The Cost of Returning
    cluster: factorization
    status: published
    question: Once independent capacity has decayed, what determines whether return can begin/propagate/complete?
    depends_on: ["~X"]         # replaces X's placeholder escape-probability constant
    establishes:
      - homogeneous mean-field loop solved in closed form (consensus + competence-decay + liability terms)
      - "competence decay moves the RETURN threshold, provably not the ENTRY threshold"
      - "escape is nucleated by the best-preserved channel and propagated by a ladder condition on ordered penalties"
      - "escape-ladder theorem; finite-N quantile criterion classifies 55/56 grid cells"
      - institutional time enters as accumulated escape opportunity (measured-hazard composition)
    formal_tier: [R, N]
    governance_tier: IP
    nulls:
      - strong logarithmic dwell law failed its fit criterion (replaced by measured-hazard composition)
      - naive order-statistic law for population-size dependence falsified
      - "predicted liability-decay interaction below feasible test resolution -> open registered prediction"

  - id: "XXVII"
    title: Requisite Alignment
    cluster: factorization      # capstone; candidate opener of a third cycle (see atlas §7)
    status: draft
    question: Is dimensional sufficiency (requisite variety) enough for an observation to have decision value?
    depends_on: ["~0", "-VI", "-XX"]   # ~0: has an explicit finite state space; assumes a factorization, not 0's derivation. VI refined-into, XX motivates.
    establishes:
      - "requisite alignment: the resolved distinction must align with the action-relevant distinction; alignment has geometry"
      - "requisite variety is necessary but NOT sufficient (refines the Goodhart-Ashby synthesis)"
      - "displaced feedback channel not representable by any scalar reliability q"
      - "two geometries with the same uniform-prior one-observation MI impose different value costs; ordering reverses with displacement (belief-conditioned MI may differ — see corrections)"
      - "worst case is intermediate ambiguity, not maximal displacement"
      - series' first computational-mechanistic paper
    formal_tier: [R, N]        # scalar-q non-rep is R (scope: ES-2.x channel); attenuation/geometry are N
    governance_tier: IP
    evidence: ["preregistered dynamic programming; frozen 74-cell panel; run_id 16bc675b; 486/592 (82%) resolved attenuation"]
    nulls: ["registered enrichment possibility (displaced > matched) permitted by design, did NOT occur"]
    corrections:
      - "LIVE: v1 'identical marginal MI at every displacement -> value gap is information-independent' narrowed. Geometries share cardinality, q, m, likelihood spectrum, and uniform-prior one-observation MI, but may differ in belief-conditioned MI and sequential value. The 'cannot be an information-quantity effect' inference must be narrowed/dropped. Reconcile paper key-claims + §5.2 AND brief.md XXVII paragraph against the actual simulation before treating as settled."
    unresolved:
      - loss function, action semantics, and hidden classes fixed from outside
    successors:
      - adaptive alignment (can a controller learn its feedback is displaced?)
      - contested alignment (alignment with whose loss/actions/representation?)
      - observer ecology (is alignment a channel property or an ecology property?)
      - endogenous power / strategic feedback (who selects the target?)

