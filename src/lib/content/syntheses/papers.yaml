# Governance as Engineering — canonical paper metadata
#
# Source of truth for the series' structure. The brief's paper table and the
# dependency atlas's cards should be generated from — or at minimum audited
# against — this file, so the three documents cannot silently disagree.
#
# TIER VOCABULARY (atlas four-tier scheme; the public brief folds R+N into "R within the model"):
#   R  = analytic theorem or exact finite derivation; true wherever its premises hold
#   N  = envelope-controlled numerical result; preregistered simulation over a finite panel
#   E  = empirical observation against out-of-model data under a frozen protocol
#   IP = in-principle; formal core sound, institutional/self mapping is interpretive
#   H  = heuristic; estimated, illustrative, or loosely applied
#
# DEPENDENCY ARROW STRENGTH (in depends_on / successors, prefix the target):
#   "=" derivational (follows by proof/exact construction)
#   "-" structural   (built on it; fails if it fails; argument not theorem)
#   "~" thematic     (reuses/reinterprets/gives-mechanism-to; no validity dependence)
#
# status: published | draft
# cluster: foundation | cycle-one | cycle-two | limits | factorization | self

meta:
  series_count_incl_paper0: 28          # Paper 0 + I..XXVII
  self_subseries_count: 3
  brief_reconciled_through: "XXVII"
  atlas_reconciled_through: "XXVII"
  atlas_version: "v2"
  last_updated: "2026-07-23"
  notes:
    - "formal_tier [R] is scope-bound where a result is model-internal; see each paper's evidence line for the model."
    - "depends_on prefixes: = derives | - assumes/structural | ~ grounds/thematic. The atlas carries finer relation labels (mechanizes, refines, motivates, retracts, transfers-by-analogy)."
    - "OPEN: XXVII MI correction (see XXVII.corrections) is unreconciled against paper and brief."

papers:

  - id: "0"
    title: Below the Factorization
    cluster: foundation
    status: published
    question: Is factorization primitive, or derived from something simpler?
    depends_on: []
    establishes:
      - factorization derived from bounded capacity + bare temporal prediction (no action/reward/survival)
      - "emergence: bottlenecked predictor recovers latent causal variables unprompted"
      - "structured blindness: a coherent causal subspace sacrificed whole under capacity starvation"
      - "non-unique, symmetry-broken selection at the capacity margin"
      - behaviorally-equivalent classes -> coordination is selection within a class, not discovery of truth
      - causal-variable-preserving classes objectively better (robustness, sample efficiency, transfer)
    formal_tier: [R, N]        # IP for the two-ingredient argument; R/N for the mechanism
    governance_tier: IP
    evidence: [argument against candidate primitives, 40 seeds across 2 preregistrations]
    nulls: [first structured-blindness operationalization failed; corrected under 2nd registered run]
    unresolved: [passive/active distinction untested, two-ingredient claim demonstrated not proven general]
    successors: ["~VI", "-XIX", "=XX", "-XXIII", "-XXVII", "-Self-I"]

