# Governance as Engineering — canonical paper metadata
#
# Source of truth for the series' structure. The brief's paper table and the
# dependency atlas's cards should be generated from — or at minimum audited
# against — this file, so the three documents cannot silently disagree.
#
# TIER VOCABULARY (atlas four-tier scheme; the public brief folds R+N into "R within the model"):
#   R  = analytic theorem or exact finite derivation; true wherever its premises hold
#   N  = envelope-controlled numerical result; preregistered simulation over a finite panel
#   E  = empirical observation against out-of-model data under a frozen protocol
#   IP = in-principle; formal core sound, institutional/self mapping is interpretive
#   H  = heuristic; estimated, illustrative, or loosely applied
#
# DEPENDENCY ARROW STRENGTH (in depends_on / successors, prefix the target):
#   "=" derivational (follows by proof/exact construction)
#   "-" structural   (built on it; fails if it fails; argument not theorem)
#   "~" thematic     (reuses/reinterprets/gives-mechanism-to; no validity dependence)
#
# CROSS-SERIES LINKS: edges to the companion series *Systemic Optimization* (SO)
# live once, canonically, in `cross_series_links` at the end of this file. A paper
# entry carries only `so_links: [edge ids]` as a pointer. SO results are synthetic
# within-model results under SO's own evidence convention (confirmatory /
# prespecified descriptive / exploratory / structural); they never upgrade a GaE
# governance claim above IP.
#
# status: published | draft
# cluster: foundation | cycle-one | cycle-two | limits | factorization | self

meta:
  series_count_incl_paper0: 29          # Paper 0 + I..XXVIII
  self_subseries_count: 3
  brief_reconciled_through: "XXVII"
  atlas_reconciled_through: "XXVIII"
  atlas_version: "v2.1"
  last_updated: "2026-11-08"
  companion_series:
    - id: SO
      title: Systemic Optimization
      papers: [SO-WP0, SO-WP1]
      relation: "complement, not continuation: GaE = the architecture through which institutions observe/decide/adapt; SO = how the optimization problem itself is constructed and evaluated"
  notes:
    - "formal_tier [R] is scope-bound where a result is model-internal; see each paper's evidence line for the model."
    - "depends_on prefixes: = derives | - assumes/structural | ~ grounds/thematic. The atlas carries finer relation labels (mechanizes, refines, motivates, retracts, transfers-by-analogy, corroborates-cross-model, bounds)."
    - "OPEN: XXVII MI correction (see XXVII.corrections) is unreconciled against paper and brief."
    - "OPEN: brief.md not yet reconciled for XXVIII (paper table, cluster text, count 'twenty-eight' -> 'twenty-nine'). The brief presents cycle two as closed (the triad, XV); placing XXVIII there means the brief must say the cycle has a later paper that dynamizes its boundary/trust elements."
    - "DECIDED 2026-11-08: XXVIII titled 'Closure Adaptation Dynamics'; cluster cycle-two as a late addition (rationale in the XXVIII entry and atlas §9)."
    - "PROPOSAL: N does not distinguish confirmatory from exploratory simulation results. SO's status vocabulary (C / PD / ED / EP / ST) is finer; consider adopting it as a sub-label on N."

