      - "conserved pressure does NOT determine realized harm"
      - "exploitation licensed by three separable capacities: concentration, accessibility, discovery"
      - deeper monitored-band suppression raises the exploitability floor
    formal_tier: [R]           # R only inside LTI / fixed-controller / non-strategic licensing
