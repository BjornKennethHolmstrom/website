<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 820 600"
   font-family="Georgia, 'Times New Roman', serif"
   version="1.1"
   id="svg30"
   sodipodi:docname="pooling-vs-exit-sv.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview30"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.4466667"
     inkscape:cx="409.90783"
     inkscape:cy="300"
     inkscape:window-width="2520"
     inkscape:window-height="1048"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg30" />
  <defs
     id="defs2">
    <style
       id="style1">
      .title   { font-size: 26px; fill: #1a1a2e; font-weight: 700; }
      .sub      { font-size: 15px; fill: #5a6472; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .phead    { font-size: 20px; font-weight: 700; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 0.05em; }
      .pslate   { fill: #475569; }
      .paccent  { fill: #c2761a; }
      .psub      { font-size: 12.5px; fill: #6b7280; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .prop      { font-size: 13px; fill: #3a4250; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .nodelbl   { font-size: 13px; fill: #ffffff; font-weight: 700; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .small     { font-size: 11px; fill: #6b7280; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .smallacc  { font-size: 11px; fill: #c2761a; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; }
      .chip      { font-size: 13px; font-style: italic; fill: #475569; }
      .chipacc   { font-size: 13px; font-style: italic; fill: #c2761a; }
      .cap       { font-size: 13.5px; fill: #475569; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <marker
       id="arrowSlate"
       markerWidth="9"
       markerHeight="9"
       refX="7"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M0,0 L7,3 L0,6 Z"
         fill="#94a3b8"
         id="path1" />
    </marker>
    <marker
       id="arrowAcc"
       markerWidth="9"
       markerHeight="9"
       refX="7"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M0,0 L7,3 L0,6 Z"
         fill="#c2761a"
         id="path2" />
    </marker>
  </defs>
  <!-- Title -->
  <text
     x="40"
     y="46"
     class="title"
     id="text2">Poolning vs. utträde</text>
  <text
     x="40"
     y="70"
     class="sub"
     id="text3">Två sätt att spendera mångfald — och bara ett överlever en konsensus som agerar på världen</text>
  <!-- ============ VÄNSTER PANEL: POOLNING ============ -->
  <rect
     x="40"
     y="95"
     width="355"
     height="420"
     rx="8"
     fill="#f8fafc"
     stroke="#cbd5e1"
     stroke-width="1.5"
     id="rect3" />
  <text
     x="62"
     y="135"
     class="phead pslate"
     id="text4">POOLNING</text>
  <text
     x="62"
     y="157"
     class="psub"
     id="text5">medan konsensus bara läses</text>
  <!-- diagram: N observatörer -> blandning -->
  <text
     x="95"
     y="188"
     text-anchor="middle"
     class="small"
     id="text6">observatörer</text>
  <circle
     cx="95"
     cy="210"
     r="8"
     fill="#64748b"
     id="circle6" />
  <circle
     cx="95"
     cy="240"
     r="8"
     fill="#64748b"
     id="circle7" />
  <circle
     cx="95"
     cy="270"
     r="8"
     fill="#64748b"
     id="circle8" />
  <circle
     cx="95"
     cy="300"
     r="8"
     fill="#64748b"
     id="circle9" />
  <line
     x1="105"
     y1="210"
     x2="290"
     y2="255"
     stroke="#94a3b8"
     stroke-width="1.4"
     marker-end="url(#arrowSlate)"
     id="line9" />
  <line
     x1="105"
     y1="240"
     x2="290"
     y2="255"
     stroke="#94a3b8"
     stroke-width="1.4"
     id="line10" />
  <line
     x1="105"
     y1="270"
     x2="290"
     y2="255"
     stroke="#94a3b8"
     stroke-width="1.4"
     id="line11" />
  <line
     x1="105"
     y1="300"
     x2="290"
     y2="255"
     stroke="#94a3b8"
     stroke-width="1.4"
     marker-end="url(#arrowSlate)"
     id="line12" />
  <circle
     cx="322.94931"
     cy="255"
     r="31.949308"
     fill="#64748b"
     id="circle12"
     style="stroke-width:1.33122" />
  <text
     x="323.29492"
     y="257.61752"
     text-anchor="middle"
     class="nodelbl"
     id="text12">blandning</text>
  <text
     x="315"
     y="298"
     text-anchor="middle"
     class="small"
     id="text13">hålls alla samtidigt</text>
  <!-- egenskaper -->
  <text
     x="62"
     y="350"
     class="prop"
     id="text14">• håller alla observatörer samtidigt</text>
  <text
     x="62"
     y="372"
     class="prop"
     id="text15">• oberoende fel tar ut varandra i medelvärdet</text>
  <text
     x="62"
     y="394"
     class="prop"
     id="text16">• alternativen <tspan
   font-weight="700"
   id="tspan15">ADDERAR</tspan> — värdet ligger i summan</text>
  <text
     x="62"
     y="448"
     class="chip"
     id="text17">portföljens logik</text>
  <!-- ============ HÖGER PANEL: UTTRÄDE ============ -->
  <rect
     x="425"
     y="95"
     width="355"
     height="420"
     rx="8"
     fill="#fdf8f0"
     stroke="#e0a64e"
     stroke-width="2.5"
     id="rect17" />
  <text
     x="447"
     y="135"
     class="phead paccent"
     id="text18">UTTRÄDE</text>
  <text
     x="447"
     y="157"
     class="psub"
     id="text19">när konsensus beslutar något</text>
  <!-- diagram: A misslyckas -> avhopp till B -->
  <rect
     x="455"
     y="200"
     width="86"
     height="52"
     rx="6"
     fill="#64748b"
     id="rect19" />
  <text
     x="498"
     y="231"
     text-anchor="middle"
     class="nodelbl"
     id="text20">A</text>
  <text
     x="498"
     y="272"
     text-anchor="middle"
     class="smallacc"
     id="text21">misslyckas / infångad</text>
  <path
     d="M 545 215 C 610 215, 615 268, 660 282"
     fill="none"
     stroke="#c2761a"
     stroke-width="1.8"
     marker-end="url(#arrowAcc)"
     id="path21" />
  <text
     x="612"
     y="232"
     text-anchor="middle"
     class="smallacc"
     id="text22">avhopp</text>
  <rect
     x="665"
     y="258"
     width="86"
     height="52"
     rx="6"
     fill="#fdf3e3"
     stroke="#e0a64e"
     stroke-width="2"
     stroke-dasharray="5 4"
     id="rect22" />
  <text
     x="708"
     y="289"
     text-anchor="middle"
     class="paccent"
     font-size="17"
     font-weight="700"
     font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
     id="text23">B</text>
  <text
     x="708"
     y="330"
     text-anchor="middle"
     class="small"
     id="text24">hålls i reserv</text>
  <!-- egenskaper -->
  <text
     x="433"
     y="368"
     class="prop"
     id="text25">• en apparat i taget</text>
  <text
     x="433"
     y="390"
     class="prop"
     id="text26">• B:s värde är den <tspan
   font-style="italic"
   id="tspan25">outnyttjade</tspan> optionen</text>
  <text
     x="433"
     y="412"
     class="prop"
     id="text27">• alternativen <tspan
   font-weight="700"
   id="tspan26">KONKURRERAR</tspan> — värdet ligger i lämnandet</text>
  <text
     x="447"
     y="462"
     class="chipacc"
     id="text28">logiken hos en real option</text>
  <!-- Bildtext -->
  <text
     x="40"
     y="552"
     class="cap"
     id="text29">Performativitet är gångjärnet: när kombinationen av skattningen <tspan
   font-style="italic"
   id="tspan28">är</tspan> handlingen som förverkligar den finns det inget fast mål kvar att</text>
  <text
     x="40"
     y="574"
     class="cap"
     id="text30">poola mot — portföljoperationen blir otillgänglig, och lämnandet är det enda draget kvar.</text>
</svg>
