<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="t2 d2" font-family="'Source Sans 3','Source Sans Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="t2">The prize is not one prize: consequence coupling in South Korea</title>
  <desc id="d2">One early educational rank, meaning university tier and location, branches into three later domains: first employment, place, and partnership and family. Employment also shapes place, and place bears on family formation. The links to employment and place are documented in Korean evidence; the link to partnership and family is associational only. A green mark on the employment branch shows where the local-talent hiring rule loosened the link, narrowing the starting-wage gap between regional and Seoul-area graduates.</desc>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="gh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" orient="auto"><path fill="#C28A22" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker markerUnits="userSpaceOnUse" id="ch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" orient="auto"><path fill="#2C3A5A" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect fill="#F4F6F9" x="0" y="0" width="1100" height="640" rx="18"/>
  <text fill="#1E2A44" font-size="22" font-weight="600" x="40" y="50">The prize is not one prize</text>
  <text fill="#5B6475" font-size="15" x="40" y="74">One early rank reaches into several later domains of life</text>

  <!-- source -->
  <rect fill="#FFF7E8" stroke="#C28A22" stroke-width="2" x="40" y="268" width="260" height="88" rx="12"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="170" y="303" text-anchor="middle">Early educational rank</text>
  <text fill="#5B6475" font-size="13.5" x="170" y="326" text-anchor="middle">university tier and location</text>

  <!-- branches -->
  <path fill="none" stroke="#C28A22" stroke-width="3.2" marker-end="url(#gh)" d="M300,300 C520,300 520,150 736,150"/>
  <path fill="none" stroke="#C28A22" stroke-width="3.2" marker-end="url(#gh)" d="M300,312 C520,312 520,322 736,322"/>
  <path fill="none" stroke="#C28A22" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#gh)" d="M300,324 C520,324 520,494 736,494"/>

  <!-- branch labels -->
  <text fill="#5B6475" font-size="13.5" x="724" y="214" text-anchor="end">wage and large-firm premiums</text>
  <text fill="#5B6475" font-size="13.5" x="600" y="306" text-anchor="middle">pull toward the capital region</text>
  <text fill="#5B6475" font-size="13.5" x="470" y="466" text-anchor="middle">associations only,</text>
  <text fill="#5B6475" font-size="13.5" x="470" y="484" text-anchor="middle">causality not established</text>

  <!-- domains -->
  <rect fill="#FFFFFF" stroke="#2C3A5A" stroke-width="1.6" x="740" y="112" width="320" height="76" rx="10"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="760" y="143">First employment</text>
  <text fill="#5B6475" font-size="13.5" x="760" y="166">employer size, contract type, starting wage</text>

  <rect fill="#FFFFFF" stroke="#2C3A5A" stroke-width="1.6" x="740" y="284" width="320" height="76" rx="10"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="760" y="315">Place</text>
  <text fill="#5B6475" font-size="13.5" x="760" y="338">capital-region jobs, networks and housing</text>

  <rect fill="#FFFFFF" stroke="#2C3A5A" stroke-width="1.6" x="740" y="456" width="320" height="76" rx="10"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="760" y="487">Partnership and family</text>
  <text fill="#5B6475" font-size="13.5" x="760" y="510">educational homogamy, family formation</text>

  <!-- cross links -->
  <path fill="none" stroke="#2C3A5A" stroke-width="1.6" marker-end="url(#ch)" d="M1010,188 L1010,280"/>
  <path fill="none" stroke="#2C3A5A" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ch)" d="M1010,360 L1010,452"/>

  <!-- decoupling cut on employment branch -->
  <line stroke="#3E8A73" stroke-width="4" stroke-linecap="round" x1="500" y1="220" x2="522" y2="244"/>
  <line stroke="#3E8A73" stroke-width="4" stroke-linecap="round" x1="512" y1="210" x2="534" y2="234"/>
  <line stroke="#4E8C79" stroke-width="1.2" x1="470" y1="134" x2="506" y2="212"/>
  <rect fill="#E3F0EB" stroke="#4E8C79" stroke-width="1.2" x="330" y="98" width="336" height="36" rx="18"/>
  <text fill="#2F6B59" font-size="13.5" font-weight="600" x="498" y="121" text-anchor="middle">Local-talent hiring loosened this link</text>

  <!-- legend -->
  <line fill="none" stroke="#C28A22" stroke-width="3.2" x1="40" y1="592" x2="80" y2="592"/>
  <text fill="#5B6475" font-size="13.5" x="90" y="597">documented link in Korean evidence</text>
  <line fill="none" stroke="#C28A22" stroke-width="2.6" stroke-dasharray="8 6" x1="340" y1="592" x2="380" y2="592"/>
  <text fill="#5B6475" font-size="13.5" x="390" y="597">associational link</text>
  <line fill="none" stroke="#2C3A5A" stroke-width="1.6" x1="540" y1="592" x2="580" y2="592"/>
  <text fill="#5B6475" font-size="13.5" x="590" y="597">downstream reinforcement</text>
  <line stroke="#3E8A73" stroke-width="4" stroke-linecap="round" x1="778" y1="582" x2="790" y2="602"/>
  <line stroke="#3E8A73" stroke-width="4" stroke-linecap="round" x1="788" y1="582" x2="800" y2="602"/>
  <text fill="#5B6475" font-size="13.5" x="812" y="597">link loosened by policy (causal evidence)</text>
</svg>
