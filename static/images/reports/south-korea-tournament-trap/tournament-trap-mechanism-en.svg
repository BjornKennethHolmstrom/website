<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t1 d1" font-family="'Source Sans 3','Source Sans Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t1">The Tournament Trap: loop, modifiers and reform levers</title>
  <desc id="d1">A four-stage reinforcing loop runs from effective scarcity to rank, invest and concentrate, and back to effective scarcity. Consequence coupling raises the stakes by acting on investment; rank legitimacy raises durability by protecting the ranking stage. Green tags show where each class of reform acts: supply and regional opportunity on scarcity and concentration, discriminator reform on rank (and only at the margin of effort), gradient reform on investment, decoupling and reversibility on consequence coupling, and selection redesign on legitimacy.</desc>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path fill="#C28A22" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker markerUnits="userSpaceOnUse" id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path fill="#2C3A5A" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect fill="#F4F6F9" x="0" y="0" width="1100" height="720" rx="18"/>
  <text fill="#1E2A44" font-size="22" font-weight="600" x="40" y="52">The Tournament Trap: loop, modifiers and reform levers</text>

  <!-- centre -->
  <text fill="#1E2A44" font-size="20" font-weight="600" x="550" y="354" text-anchor="middle">A loop that</text>
  <text fill="#1E2A44" font-size="20" font-weight="600" x="550" y="380" text-anchor="middle">renews scarcity</text>

  <!-- loop arcs (r=190 around 550,360) -->
  <path fill="none" stroke="#C28A22" stroke-width="3.2" marker-end="url(#g)" d="M650.7,198.9 A190,190 0 0 1 730.7,301.3"/>
  <path fill="none" stroke="#C28A22" stroke-width="3.2" marker-end="url(#g)" d="M730.7,418.7 A190,190 0 0 1 650.7,521.1"/>
  <path fill="none" stroke="#C28A22" stroke-width="3.2" marker-end="url(#g)" d="M449.3,521.1 A190,190 0 0 1 369.3,418.7"/>
  <path fill="none" stroke="#C28A22" stroke-width="3.2" marker-end="url(#g)" d="M369.3,301.3 A190,190 0 0 1 449.3,198.9"/>

  <!-- nodes -->
  <rect fill="#FFFFFF" stroke="#2C3A5A" stroke-width="1.6" x="455" y="139" width="190" height="62" rx="10"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="550" y="165" text-anchor="middle">Effective scarcity</text>
  <text fill="#5B6475" font-size="13.5" x="550" y="186" text-anchor="middle">few credible substitutes</text>

  <rect fill="#FFFFFF" stroke="#2C3A5A" stroke-width="1.6" x="645" y="329" width="190" height="62" rx="10"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="740" y="355" text-anchor="middle">Rank</text>
  <text fill="#5B6475" font-size="13.5" x="740" y="376" text-anchor="middle">selection allocates access</text>

  <rect fill="#FFFFFF" stroke="#2C3A5A" stroke-width="1.6" x="455" y="519" width="190" height="62" rx="10"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="550" y="545" text-anchor="middle">Invest</text>
  <text fill="#5B6475" font-size="13.5" x="550" y="566" text-anchor="middle">effort changes placement</text>

  <rect fill="#FFFFFF" stroke="#2C3A5A" stroke-width="1.6" x="265" y="329" width="190" height="62" rx="10"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="360" y="355" text-anchor="middle">Concentrate</text>
  <text fill="#5B6475" font-size="13.5" x="360" y="376" text-anchor="middle">effort converges on the top</text>

  <!-- modifier: legitimacy (top right) -> Rank -->
  <rect fill="#EAEEF5" stroke="#2C3A5A" stroke-width="1.2" stroke-dasharray="5 4" x="820" y="96" width="250" height="92" rx="10"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="838" y="124">Rank legitimacy</text>
  <text fill="#5B6475" font-size="13.5" x="838" y="146">raises durability: a transparent</text>
  <text fill="#5B6475" font-size="13.5" x="838" y="165">rank is hard to challenge as unfair</text>
  <path fill="none" stroke="#2C3A5A" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#m)" d="M820,150 C760,170 770,260 772,324"/>

  <!-- modifier: coupling (bottom left) -> Invest -->
  <rect fill="#EAEEF5" stroke="#2C3A5A" stroke-width="1.2" stroke-dasharray="5 4" x="40" y="534" width="270" height="92" rx="10"/>
  <text fill="#1E2A44" font-size="18" font-weight="600" x="58" y="562">Consequence coupling</text>
  <text fill="#5B6475" font-size="13.5" x="58" y="584">raises the stakes: one rank reaches</text>
  <text fill="#5B6475" font-size="13.5" x="58" y="603">into work, place and private life</text>
  <path fill="none" stroke="#2C3A5A" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#m)" d="M310,568 C370,560 410,555 452,552"/>

  <!-- levers -->
  <line stroke="#4E8C79" stroke-width="1.2" x1="550" y1="122" x2="550" y2="139"/>
  <rect fill="#E3F0EB" stroke="#4E8C79" stroke-width="1.2" x="484" y="94" width="132" height="28" rx="14"/>
  <text fill="#2F6B59" font-size="13.5" font-weight="600" x="550" y="113" text-anchor="middle">Supply reform (S)</text>

  <line stroke="#4E8C79" stroke-width="1.2" x1="835" y1="360" x2="858" y2="360"/>
  <rect fill="#E3F0EB" stroke="#4E8C79" stroke-width="1.2" x="858" y="346" width="190" height="28" rx="14"/>
  <text fill="#2F6B59" font-size="13.5" font-weight="600" x="953" y="365" text-anchor="middle">Discriminator reform (E)</text>

  <line stroke="#4E8C79" stroke-width="1.2" x1="645" y1="566" x2="690" y2="600"/>
  <rect fill="#E3F0EB" stroke="#4E8C79" stroke-width="1.2" x="690" y="588" width="150" height="28" rx="14"/>
  <text fill="#2F6B59" font-size="13.5" font-weight="600" x="765" y="607" text-anchor="middle">Gradient reform (P)</text>

  <line stroke="#4E8C79" stroke-width="1.2" x1="265" y1="360" x2="244" y2="360"/>
  <rect fill="#E3F0EB" stroke="#4E8C79" stroke-width="1.2" x="40" y="346" width="204" height="28" rx="14"/>
  <text fill="#2F6B59" font-size="13.5" font-weight="600" x="142" y="365" text-anchor="middle">Regional opportunity (S)</text>

  <rect fill="#E3F0EB" stroke="#4E8C79" stroke-width="1.2" x="40" y="636" width="270" height="28" rx="14"/>
  <text fill="#2F6B59" font-size="13.5" font-weight="600" x="175" y="655" text-anchor="middle">Decoupling and reversibility (C)</text>

  <line stroke="#4E8C79" stroke-width="1.2" x1="945" y1="188" x2="945" y2="200"/>
  <rect fill="#E3F0EB" stroke="#4E8C79" stroke-width="1.2" x="850" y="200" width="220" height="28" rx="14"/>
  <text fill="#2F6B59" font-size="13.5" font-weight="600" x="960" y="219" text-anchor="middle">Selection redesign (L), last</text>

  <!-- legend -->
  <line fill="none" stroke="#C28A22" stroke-width="3.2" x1="560" y1="672" x2="596" y2="672" marker-end="url(#g)"/>
  <text fill="#5B6475" font-size="13.5" x="606" y="677">reinforcing loop</text>
  <line fill="none" stroke="#2C3A5A" stroke-width="1.6" stroke-dasharray="6 5" x1="720" y1="672" x2="756" y2="672" marker-end="url(#m)"/>
  <text fill="#5B6475" font-size="13.5" x="766" y="677">modifier</text>
  <rect fill="#E3F0EB" stroke="#4E8C79" stroke-width="1.2" x="840" y="662" width="26" height="20" rx="10"/>
  <text fill="#5B6475" font-size="13.5" x="876" y="677">where reform acts</text>
</svg>
