<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Georgia, serif">

  <rect width="760" height="340" fill="#fafaf8"/>

  <rect x="20" y="130" width="120" height="60" rx="6" fill="#e8f0e8" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="80" y="155" text-anchor="middle" font-size="11" fill="#2a4a35" font-weight="bold">Styrt</text>
  <text x="80" y="170" text-anchor="middle" font-size="11" fill="#2a4a35" font-weight="bold">system</text>
  <text x="80" y="185" text-anchor="middle" font-size="9.5" fill="#4a7c59">(hög variation)</text>

  <line x1="140" y1="160" x2="195" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="195" y="130" width="110" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="250" y="152" text-anchor="middle" font-size="10.5" fill="#7b1a13" font-weight="bold">Rumslig</text>
  <text x="250" y="166" text-anchor="middle" font-size="10.5" fill="#7b1a13" font-weight="bold">aggregering</text>
  <text x="250" y="181" text-anchor="middle" font-size="9" fill="#c0392b">förstör platsinfo</text>

  <text x="250" y="120" text-anchor="middle" font-size="10" fill="#c0392b" font-style="italic">F₁ — Artikel I</text>

  <line x1="305" y1="160" x2="355" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="355" y="130" width="110" height="60" rx="6" fill="#fef3e2" stroke="#d68910" stroke-width="1.5"/>
  <text x="410" y="152" text-anchor="middle" font-size="10.5" fill="#7d5a0a" font-weight="bold">Frekvens-</text>
  <text x="410" y="166" text-anchor="middle" font-size="10.5" fill="#7d5a0a" font-weight="bold">filter</text>
  <text x="410" y="181" text-anchor="middle" font-size="9" fill="#d68910">gap vid snabb/långsam</text>

  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#d68910" font-style="italic">F₂ — Artikel II</text>

  <line x1="465" y1="160" x2="515" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="515" y="130" width="110" height="60" rx="6" fill="#f0eaf8" stroke="#7d3c98" stroke-width="1.5"/>
  <text x="570" y="152" text-anchor="middle" font-size="10.5" fill="#4a1a6b" font-weight="bold">Representations-</text>
  <text x="570" y="166" text-anchor="middle" font-size="10.5" fill="#4a1a6b" font-weight="bold">kedja</text>
  <text x="570" y="181" text-anchor="middle" font-size="9" fill="#7d3c98">bruset tar över</text>

  <text x="570" y="120" text-anchor="middle" font-size="10" fill="#7d3c98" font-style="italic">F₃ — Artikel III</text>

  <line x1="625" y1="160" x2="675" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="675" y="130" width="70" height="60" rx="6" fill="#e8e8f0" stroke="#2c3e7a" stroke-width="1.5"/>
  <text x="710" y="155" text-anchor="middle" font-size="10.5" fill="#1a2350" font-weight="bold">Policy-</text>
  <text x="710" y="170" text-anchor="middle" font-size="10.5" fill="#1a2350" font-weight="bold">lager</text>
  <text x="710" y="185" text-anchor="middle" font-size="9" fill="#2c3e7a">(fantom)</text>

  <line x1="80" y1="190" x2="80" y2="255" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="80" y1="255" x2="390" y2="255" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>

  <rect x="295" y="235" width="190" height="48" rx="6" fill="#e2f0fb" stroke="#1a6fa8" stroke-width="1.5"/>
  <text x="390" y="255" text-anchor="middle" font-size="10.5" fill="#0d3d63" font-weight="bold">Observation av allmänning</text>
  <text x="390" y="270" text-anchor="middle" font-size="9" fill="#1a6fa8">låg dimensionalitet → kollaps</text>
  <text x="390" y="224" text-anchor="middle" font-size="10" fill="#1a6fa8" font-style="italic">F₄ — Artikel IV</text>

  <line x1="485" y1="259" x2="710" y2="259" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="710" y1="259" x2="710" y2="190" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-dash)"/>

  <text x="390" y="310" text-anchor="middle" font-size="10" fill="#555" font-style="italic">
    Varje steg tar som indata den redan degraderade utdatan från föregående steg.
  </text>
  <text x="390" y="325" text-anchor="middle" font-size="10" fill="#555" font-style="italic">
    Förlusterna är sekventiella och multiplikativa, inte parallella och additiva.
  </text>

  <text x="390" y="28" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">
    Figur 1. Informationsflöde genom ett styrsystem
  </text>
  <text x="390" y="46" text-anchor="middle" font-size="11" fill="#555">
    Fyra fellägen positionerade vid deras angreppspunkter på observationskanalen
  </text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="arr-dash" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

</svg>
