<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04ECF6" stop-opacity="0.05"/>
      <stop offset="0.75" stop-color="#04ECF6" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#04ECF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8943A" stop-opacity="0.05"/>
      <stop offset="0.75" stop-color="#E8943A" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#E8943A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="1200" fill="#1E2633"/>

  <!-- faint structural circuitry (series texture) -->
  <g stroke="#2FD4E0" stroke-opacity="0.12" stroke-width="1" fill="none">
    <path d="M 150 210 L 210 210 L 232 188"/>
    <circle cx="232" cy="188" r="3" fill="#2FD4E0" fill-opacity="0.25" stroke="none"/>
    <path d="M 1046 250 L 1010 214 L 958 214"/>
    <path d="M 1040 1010 L 1004 1010 L 986 1030"/>
    <circle cx="986" cy="1030" r="3" fill="#2FD4E0" fill-opacity="0.25" stroke="none"/>
    <path d="M 158 962 L 158 998 L 196 1014"/>
  </g>

  <!-- the two jurisdictions: faint tints that lose distinctness downward -->
  <rect x="190" y="150" width="404" height="770" fill="url(#fadeLeft)"/>
  <rect x="648" y="150" width="404" height="770" fill="url(#fadeRight)"/>

  <!-- the boundary: crisp at the top, bending and dissolving under the trajectory -->
  <text x="583" y="126" font-size="30" fill="#2FD4E0" font-style="italic" filter="url(#softGlow)">&#928;</text>
  <line x1="600" y1="146" x2="600" y2="380" stroke="#2FD4E0" stroke-opacity="0.60"
        stroke-width="1.7" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M 600 380 C 602 450, 605 520, 609 580" fill="none" stroke="#2FD4E0" stroke-opacity="0.44"
        stroke-width="1.6" stroke-dasharray="2 16" stroke-linecap="round"/>
  <path d="M 609 580 C 613 640, 618 700, 623 760" fill="none" stroke="#2FD4E0" stroke-opacity="0.30"
        stroke-width="1.5" stroke-dasharray="2 26" stroke-linecap="round"/>
  <path d="M 623 760 C 627 806, 631 852, 634 892" fill="none" stroke="#2FD4E0" stroke-opacity="0.17"
        stroke-width="1.4" stroke-dasharray="2 40" stroke-linecap="round"/>
  <!-- remnants of the boundary -->
  <g fill="#2FD4E0" stroke="none">
    <circle cx="637" cy="922" r="1.8" fill-opacity="0.14"/>
    <circle cx="628" cy="956" r="1.5" fill-opacity="0.11"/>
    <circle cx="646" cy="984" r="1.4" fill-opacity="0.09"/>
    <circle cx="632" cy="1014" r="1.2" fill-opacity="0.07"/>
    <circle cx="651" cy="1042" r="1.1" fill-opacity="0.05"/>
  </g>

  <!-- cross-boundary coupling: faint at the top, insistent below -->
  <g fill="none" stroke="#E8943A" stroke-linecap="round">
    <path d="M 400 432 C 500 396, 730 396, 830 436" stroke-opacity="0.10" stroke-width="1.3"/>
    <path d="M 430 566 C 520 530, 720 530, 810 566" stroke-opacity="0.18" stroke-width="1.6"/>
    <path d="M 480 690 C 546 658, 700 658, 760 690" stroke-opacity="0.30" stroke-width="2.0"/>
    <path d="M 530 796 C 566 770, 668 770, 705 796" stroke-opacity="0.45" stroke-width="2.4"/>
  </g>
  <g fill="#E8943A" stroke="none">
    <path d="M 826 428 L 834 439 L 821 440 Z" fill-opacity="0.12"/>
    <path d="M 434 558 L 426 569 L 439 570 Z" fill-opacity="0.20"/>
    <path d="M 756 682 L 764 693 L 751 694 Z" fill-opacity="0.32"/>
    <path d="M 534 788 L 526 799 L 539 800 Z" fill-opacity="0.47"/>
  </g>

  <!-- the reflexive channel: the system's own adaptation reaches back and bends the split -->
  <path d="M 470 706 C 486 616, 524 552, 592 520"
        fill="none" stroke="#E8943A" stroke-width="3.0" stroke-linecap="round" filter="url(#amberGlow)"/>
  <path d="M 580 512 L 602 518 L 586 534 Z" fill="#E8943A" filter="url(#amberGlow)"/>
  <text x="648" y="500" font-size="19" letter-spacing="1" fill="#7E8A9A" font-style="italic">&#8706;&#916;/&#8706;&#952; &#8800; 0</text>

  <!-- left state trace: independent above, entrained below -->
  <path d="M 356 178 C 322 232, 396 274, 358 326 C 322 376, 398 416, 362 466
           C 336 512, 404 556, 424 606 C 442 656, 462 702, 490 750
           C 518 800, 556 852, 590 902 C 606 928, 616 944, 623 954"
        fill="none" stroke="#04ECF6" stroke-width="3.6" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <path d="M 356 178 C 322 232, 396 274, 358 326 C 322 376, 398 416, 362 466
           C 336 512, 404 556, 424 606 C 442 656, 462 702, 490 750
           C 518 800, 556 852, 590 902 C 606 928, 616 944, 623 954"
        fill="none" stroke="#CFFAFD" stroke-width="1.3" stroke-linecap="round"/>

  <!-- right state trace: its own life above, a mirror below -->
  <path d="M 858 204 C 898 252, 826 296, 872 344 C 912 388, 842 428, 876 476
           C 902 518, 830 560, 812 608 C 794 656, 774 702, 748 750
           C 722 800, 686 852, 654 902 C 640 928, 630 944, 624 954"
        fill="none" stroke="#E8943A" stroke-width="3.4" stroke-linecap="round" filter="url(#amberGlow)"/>
  <path d="M 858 204 C 898 252, 826 296, 872 344 C 912 388, 842 428, 876 476
           C 902 518, 830 560, 812 608 C 794 656, 774 702, 748 750
           C 722 800, 686 852, 654 902 C 640 928, 630 944, 624 954"
        fill="none" stroke="#FFE2C2" stroke-width="1.2" stroke-linecap="round"/>

  <!-- where the separation used to be: the entangled node (series particle motif) -->
  <circle cx="623" cy="956" r="7" fill="#04ECF6" filter="url(#cyanGlow)"/>
  <g filter="url(#softGlow)">
    <circle cx="596" cy="978" r="2.4" fill="#E8943A"/>
    <circle cx="652" cy="972" r="2.1" fill="#04ECF6"/>
    <circle cx="612" cy="1002" r="1.9" fill="#04ECF6"/>
    <circle cx="640" cy="1000" r="2.2" fill="#E8943A"/>
    <circle cx="580" cy="1000" r="1.6" fill="#04ECF6"/>
    <circle cx="666" cy="994" r="1.5" fill="#E8943A"/>
    <circle cx="600" cy="1026" r="1.5" fill="#E8943A"/>
    <circle cx="646" cy="1026" r="1.4" fill="#04ECF6"/>
    <circle cx="623" cy="1044" r="1.3" fill="#2FD4E0"/>
  </g>
</svg>
