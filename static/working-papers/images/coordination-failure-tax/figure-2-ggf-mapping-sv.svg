<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Georgia, serif">

  <rect width="760" height="380" fill="#fafaf8"/>

  <text x="380" y="28" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">
    Figur 2. GGF som ett strukturellt svar på fyra diagnostiserade fellägen
  </text>
  <text x="380" y="46" text-anchor="middle" font-size="11" fill="#555">
    Varje arkitektonisk princip är bärande mot en specifik begränsning
  </text>

  <rect x="20" y="62" width="170" height="32" rx="4" fill="#e0e0e0"/>
  <text x="105" y="82" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Artikel / felläge</text>

  <rect x="200" y="62" width="185" height="32" rx="4" fill="#e0e0e0"/>
  <text x="292" y="78" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Westfalisk</text>
  <text x="292" y="90" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">manifestation</text>

  <rect x="395" y="62" width="345" height="32" rx="4" fill="#e0e0e0"/>
  <text x="567" y="82" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">GGF:s strukturella svar</text>

  <rect x="20" y="102" width="170" height="58" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="105" y="122" text-anchor="middle" font-size="10.5" fill="#7b1a13" font-weight="bold">Artikel I</text>
  <text x="105" y="138" text-anchor="middle" font-size="10" fill="#c0392b">Rumslig blindhet</text>
  <text x="105" y="153" text-anchor="middle" font-size="9.5" fill="#c0392b">från aggregering</text>

  <rect x="200" y="102" width="185" height="58" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1"/>
  <text x="292" y="122" text-anchor="middle" font-size="10" fill="#555">Nationell aggregerad</text>
  <text x="292" y="137" text-anchor="middle" font-size="10" fill="#555">statistik; lokala kriser</text>
  <text x="292" y="152" text-anchor="middle" font-size="10" fill="#555">osynliga tills nationella</text>

  <rect x="395" y="102" width="345" height="58" rx="4" fill="#e8f4ec" stroke="#4a7c59" stroke-width="1.2"/>
  <text x="567" y="120" text-anchor="middle" font-size="10.5" fill="#2a4a35" font-weight="bold">Subsidiaritet + bioregionala styrenheter</text>
  <text x="567" y="136" text-anchor="middle" font-size="10" fill="#4a7c59">Styrning inbäddad inom ekologiska gränser;</text>
  <text x="567" y="151" text-anchor="middle" font-size="10" fill="#4a7c59">observationsfördröjningen närmar sig noll för lokala störningar</text>

  <rect x="20" y="168" width="170" height="58" rx="4" fill="#fef3e2" stroke="#d68910" stroke-width="1.2"/>
  <text x="105" y="188" text-anchor="middle" font-size="10.5" fill="#7d5a0a" font-weight="bold">Artikel II</text>
  <text x="105" y="204" text-anchor="middle" font-size="10" fill="#d68910">Frekvensgap</text>
  <text x="105" y="219" text-anchor="middle" font-size="9.5" fill="#d68910">från ensidig styrning</text>

  <rect x="200" y="168" width="185" height="58" rx="4" fill="#fffbf0" stroke="#d68910" stroke-width="1"/>
  <text x="292" y="188" text-anchor="middle" font-size="10" fill="#555">Valcykler missar snabba</text>
  <text x="292" y="203" text-anchor="middle" font-size="10" fill="#555">kriser och långsam strukturell</text>
  <text x="292" y="218" text-anchor="middle" font-size="10" fill="#555">förändring samtidigt</text>

  <rect x="395" y="168" width="345" height="58" rx="4" fill="#e8f4ec" stroke="#4a7c59" stroke-width="1.2"/>
  <text x="567" y="186" text-anchor="middle" font-size="10.5" fill="#2a4a35" font-weight="bold">Polycentrisk nästlad arkitektur</text>
  <text x="567" y="202" text-anchor="middle" font-size="10" fill="#4a7c59">Samhälls- → bioregionala → kontinentala → globala lager,</text>
  <text x="567" y="217" text-anchor="middle" font-size="10" fill="#4a7c59">var och en kalibrerad till sitt frekvensband</text>

  <rect x="20" y="234" width="170" height="58" rx="4" fill="#f0eaf8" stroke="#7d3c98" stroke-width="1.2"/>
  <text x="105" y="254" text-anchor="middle" font-size="10.5" fill="#4a1a6b" font-weight="bold">Artikel III</text>
  <text x="105" y="270" text-anchor="middle" font-size="10" fill="#7d3c98">Preferensosynlighet</text>
  <text x="105" y="285" text-anchor="middle" font-size="9.5" fill="#7d3c98">från djupa kedjor</text>

  <rect x="200" y="234" width="185" height="58" rx="4" fill="#faf5ff" stroke="#7d3c98" stroke-width="1"/>
  <text x="292" y="254" text-anchor="middle" font-size="10" fill="#555">3–5 lager av representation;</text>
  <text x="292" y="269" text-anchor="middle" font-size="10" fill="#555">SNR under tröskelvärdet;</text>
  <text x="292" y="284" text-anchor="middle" font-size="10" fill="#555">policy styr fantomsignal</text>

  <rect x="395" y="234" width="345" height="58" rx="4" fill="#e8f4ec" stroke="#4a7c59" stroke-width="1.2"/>
  <text x="567" y="252" text-anchor="middle" font-size="10.5" fill="#2a4a35" font-weight="bold">Direkt deltagande + grunda kedjor</text>
  <text x="567" y="268" text-anchor="middle" font-size="10" fill="#4a7c59">Samhällsförsamlingar matar råd genom ≤2 lager;</text>
  <text x="567" y="283" text-anchor="middle" font-size="10" fill="#4a7c59">kretsbrytare validerar preferenssignalen på varje nivå</text>

  <rect x="20" y="300" width="170" height="58" rx="4" fill="#e2f0fb" stroke="#1a6fa8" stroke-width="1.2"/>
  <text x="105" y="320" text-anchor="middle" font-size="10.5" fill="#0d3d63" font-weight="bold">Artikel IV</text>
  <text x="105" y="336" text-anchor="middle" font-size="10" fill="#1a6fa8">Observationell</text>
  <text x="105" y="351" text-anchor="middle" font-size="9.5" fill="#1a6fa8">otillräcklighet (allmänningar)</text>

  <rect x="200" y="300" width="185" height="58" rx="4" fill="#f0f8ff" stroke="#1a6fa8" stroke-width="1"/>
  <text x="292" y="320" text-anchor="middle" font-size="10" fill="#555">Årlig aggregerad kvot;</text>
  <text x="292" y="335" text-anchor="middle" font-size="10" fill="#555">endimensionell signal;</text>
  <text x="292" y="350" text-anchor="middle" font-size="10" fill="#555">godkänner överutvinning</text>

  <rect x="395" y="300" width="345" height="58" rx="4" fill="#e8f4ec" stroke="#4a7c59" stroke-width="1.2"/>
  <text x="567" y="318" text-anchor="middle" font-size="10.5" fill="#2a4a35" font-weight="bold">Det inhemska vishetsrådet + allmänningsfonder</text>
  <text x="567" y="334" text-anchor="middle" font-size="10" fill="#4a7c59">Multigenerationell signal för långsamma variabler;</text>
  <text x="567" y="349" text-anchor="middle" font-size="10" fill="#4a7c59">kontinuerlig flerdimensionell övervakning inom resursgränser</text>

</svg>
