<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="1200" fill="#1E2633"/>

  <!-- faint structural circuitry (series texture) -->
  <g stroke="#2FD4E0" stroke-opacity="0.12" stroke-width="1" fill="none">
    <path d="M 150 210 L 210 210 L 232 188"/>
    <circle cx="232" cy="188" r="3" fill="#2FD4E0" fill-opacity="0.25" stroke="none"/>
    <path d="M 1046 250 L 1010 214 L 958 214"/>
    <path d="M 1040 1010 L 1004 1010 L 986 1030"/>
    <circle cx="986" cy="1030" r="3" fill="#2FD4E0" fill-opacity="0.25" stroke="none"/>
    <path d="M 158 962 L 158 998 L 196 1014"/>
  </g>

  <!-- the fault line: where the ecology tears if the bridge is removed -->
  <line x1="600" y1="286" x2="600" y2="726" stroke="#2FD4E0" stroke-opacity="0.10"
        stroke-width="1.4" stroke-dasharray="2 16" stroke-linecap="round"/>

  <!-- translation edges: within each cluster -->
  <g stroke="#2FD4E0" fill="none" stroke-linecap="round">
    <path d="M 250 372 L 318 512" stroke-opacity="0.20" stroke-width="1.3"/>
    <path d="M 318 512 L 238 656" stroke-opacity="0.20" stroke-width="1.3"/>
    <path d="M 250 372 L 238 656" stroke-opacity="0.14" stroke-width="1.2"/>
    <path d="M 892 358 L 962 516" stroke-opacity="0.20" stroke-width="1.3"/>
    <path d="M 962 516 L 878 668" stroke-opacity="0.20" stroke-width="1.3"/>
    <path d="M 892 358 L 878 668" stroke-opacity="0.14" stroke-width="1.2"/>
  </g>

  <!-- translation edges: the only paths between clusters, all through the bridge -->
  <g stroke="#04ECF6" fill="none" stroke-linecap="round" stroke-opacity="0.42">
    <path d="M 318 512 L 600 516" stroke-width="1.8"/>
    <path d="M 238 656 L 600 516" stroke-width="1.6"/>
    <path d="M 600 516 L 892 358" stroke-width="1.8"/>
    <path d="M 600 516 L 962 516" stroke-width="1.6"/>
  </g>

  <!-- suppressed models: preserved, not governing -->
  <g stroke="#2FD4E0" stroke-opacity="0.5" stroke-width="1.4">
    <circle cx="250" cy="372" r="13" fill="#2FD4E0" fill-opacity="0.16"/>
    <circle cx="318" cy="512" r="13" fill="#2FD4E0" fill-opacity="0.16"/>
    <circle cx="962" cy="516" r="13" fill="#2FD4E0" fill-opacity="0.16"/>
    <circle cx="878" cy="668" r="13" fill="#2FD4E0" fill-opacity="0.16"/>
  </g>

  <!-- GOVERNOR: bright, active, acting on the world -->
  <circle cx="892" cy="358" r="17" fill="#04ECF6" filter="url(#cyanGlow)"/>
  <circle cx="892" cy="358" r="6" fill="#0B3A44"/>
  <path d="M 912 348 C 962 322, 1000 312, 1032 308" fill="none" stroke="#04ECF6"
        stroke-width="3.0" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <path d="M 1026 300 L 1046 306 L 1028 316 Z" fill="#04ECF6" filter="url(#cyanGlow)"/>
  <text x="820" y="300" font-size="19" letter-spacing="3" fill="#04ECF6">GOVERNOR</text>
  <text x="820" y="324" font-size="17" letter-spacing="2.5" fill="#7E8A9A">ACTS</text>

  <!-- SENTINEL: suppressed (open ring, never governs) but sees the failure first -->
  <circle cx="238" cy="656" r="15" fill="none" stroke="#E8943A" stroke-width="3.4"
          filter="url(#amberGlow)"/>
  <text x="126" y="716" font-size="19" letter-spacing="3" fill="#E8943A">SENTINEL</text>
  <text x="126" y="740" font-size="17" letter-spacing="2.5" fill="#7E8A9A">WARNS</text>

  <!-- the warning: reaches forward in time, ahead of the spike -->
  <path d="M 252 674 C 372 768, 528 846, 634 884" fill="none" stroke="#E8943A"
        stroke-opacity="0.62" stroke-width="2.2" stroke-dasharray="3 9"
        stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- BRIDGE: the articulation point — holds the ecology connected -->
  <circle cx="600" cy="516" r="15" fill="#04ECF6" filter="url(#cyanGlow)"/>
  <circle cx="600" cy="516" r="5" fill="#0B3A44"/>
  <g filter="url(#softGlow)">
    <circle cx="576" cy="494" r="2.4" fill="#E8943A"/>
    <circle cx="626" cy="498" r="2.1" fill="#04ECF6"/>
    <circle cx="580" cy="540" r="1.9" fill="#04ECF6"/>
    <circle cx="622" cy="538" r="2.2" fill="#E8943A"/>
    <circle cx="562" cy="518" r="1.6" fill="#04ECF6"/>
    <circle cx="638" cy="518" r="1.5" fill="#E8943A"/>
    <circle cx="600" cy="550" r="1.5" fill="#E8943A"/>
    <circle cx="600" cy="486" r="1.4" fill="#2FD4E0"/>
  </g>
  <text x="548" y="438" font-size="19" letter-spacing="3" fill="#2FD4E0">BRIDGE</text>
  <text x="530" y="462" font-size="17" letter-spacing="2.5" fill="#7E8A9A">CONNECTS</text>

  <!-- selection axis: rewards the governor, and only the governor -->
  <line x1="240" y1="762" x2="900" y2="762" stroke="#5C6B7E" stroke-width="1.2"/>
  <path d="M 900 756 L 918 762 L 900 768 Z" fill="#5C6B7E"/>
  <text x="244" y="790" font-size="17" letter-spacing="2.5" fill="#5C6B7E">WINNER-TAKE-ALL SELECTION</text>

  <!-- reward reaches the governor -->
  <line x1="892" y1="754" x2="892" y2="702" stroke="#04ECF6" stroke-opacity="0.55"
        stroke-width="2" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M 886 706 L 892 690 L 898 706 Z" fill="#04ECF6" fill-opacity="0.75" filter="url(#softGlow)"/>

  <!-- and does not reach the sentinel or the bridge: stubs that fade -->
  <g stroke="#5C6B7E" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round">
    <line x1="238" y1="754" x2="238" y2="734"/>
    <line x1="600" y1="754" x2="600" y2="734"/>
  </g>
  <g fill="#5C6B7E" stroke="none">
    <circle cx="238" cy="724" r="1.5" fill-opacity="0.22"/>
    <circle cx="238" cy="712" r="1.2" fill-opacity="0.12"/>
    <circle cx="600" cy="724" r="1.5" fill-opacity="0.22"/>
    <circle cx="600" cy="712" r="1.2" fill-opacity="0.12"/>
  </g>

  <!-- lead time: the warning lands before the failure -->
  <g stroke="#E8943A" stroke-opacity="0.55" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M 646 830 L 846 830" stroke-dasharray="4 6"/>
    <path d="M 646 830 L 646 842"/>
    <path d="M 846 830 L 846 842"/>
  </g>
  <text x="676" y="816" font-size="17" letter-spacing="2.5" fill="#E8943A" fill-opacity="0.85">LEAD TIME</text>

  <!-- the active governor's error: flat, then the spike it did not see coming -->
  <path d="M 250 950 C 320 944, 380 956, 440 948 C 500 940, 560 954, 620 948
           C 680 942, 740 952, 800 946 L 824 946 L 846 858 L 868 944
           C 920 950, 960 944, 1010 950"
        fill="none" stroke="#04ECF6" stroke-width="3.2" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <path d="M 250 950 C 320 944, 380 956, 440 948 C 500 940, 560 954, 620 948
           C 680 942, 740 952, 800 946 L 824 946 L 846 858 L 868 944
           C 920 950, 960 944, 1010 950"
        fill="none" stroke="#CFFAFD" stroke-width="1.1" stroke-linecap="round"/>
  <text x="252" y="916" font-size="17" letter-spacing="2.5" fill="#7E8A9A">ACTIVE GOVERNOR ERROR</text>

  <!-- the warning tick, before the spike -->
  <line x1="646" y1="962" x2="646" y2="906" stroke="#E8943A" stroke-width="2.6"
        stroke-linecap="round" filter="url(#amberGlow)"/>
  <circle cx="646" cy="898" r="4.5" fill="#E8943A" filter="url(#amberGlow)"/>
  <text x="664" y="892" font-size="17" letter-spacing="2.5" fill="#E8943A">WARNS</text>
  <text x="864" y="868" font-size="17" letter-spacing="2.5" fill="#E8943A" fill-opacity="0.85">SPIKE</text>

  <!-- time -->
  <line x1="250" y1="1000" x2="1010" y2="1000" stroke="#5C6B7E" stroke-width="1.2"/>
  <path d="M 1010 994 L 1028 1000 L 1010 1006 Z" fill="#5C6B7E"/>
  <text x="252" y="1026" font-size="17" letter-spacing="2.5" fill="#5C6B7E">TIME</text>
</svg>
