<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="1200" fill="#1E2633"/>

  <!-- faint structural circuitry (series texture) -->
  <g stroke="#2FD4E0" stroke-opacity="0.12" stroke-width="1" fill="none">
    <path d="M 250 470 L 300 470 L 318 452"/>
    <circle cx="318" cy="452" r="3" fill="#2FD4E0" fill-opacity="0.25" stroke="none"/>
    <path d="M 980 500 L 1010 470 L 1052 470"/>
    <path d="M 760 400 L 760 372 L 800 360"/>
    <path d="M 250 820 L 222 820 L 206 838"/>
  </g>

  <!-- "outside the control set": faint region right of the boundary -->
  <rect x="760" y="408" width="244" height="424" fill="#2FD4E0" fill-opacity="0.04"/>

  <!-- zero / baseline -->
  <line x1="252" y1="820" x2="760" y2="820" stroke="#5C6B7E" stroke-width="1.4"/>

  <!-- objective direction (under the objective ->) -->
  <line x1="252" y1="858" x2="690" y2="858" stroke="#5C6B7E" stroke-width="1.2"/>
  <path d="M 690 852 L 708 858 L 690 864 Z" fill="#5C6B7E"/>

  <!-- the control boundary (membrane): inside | outside -->
  <line x1="760" y1="404" x2="760" y2="838" stroke="#2FD4E0" stroke-opacity="0.55"
        stroke-width="1.6" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- Q without the source term: ghost branch decaying to zero -->
  <path d="M 524 636 C 612 718, 690 770, 752 816"
        fill="none" stroke="#2FD4E0" stroke-opacity="0.35" stroke-width="2.2"
        stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="752" cy="816" r="4.5" fill="#2FD4E0" fill-opacity="0.4"/>

  <!-- Q held by the source: decays, then plateaus above zero at the boundary -->
  <path d="M 250 472 C 372 506, 456 600, 524 636 C 596 684, 664 690, 748 688"
        fill="none" stroke="#04ECF6" stroke-width="3.6" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <path d="M 250 472 C 372 506, 456 600, 524 636 C 596 684, 664 690, 748 688"
        fill="none" stroke="#CFFAFD" stroke-width="1.3" stroke-linecap="round"/>

  <!-- source term: enters from outside, crosses the boundary, holds Q at the plateau -->
  <path d="M 982 506 C 892 558, 818 612, 760 680"
        fill="none" stroke="#E8943A" stroke-width="3.2" stroke-linecap="round" filter="url(#amberGlow)"/>
  <path d="M 768 666 L 752 686 L 776 692 Z" fill="#E8943A" filter="url(#amberGlow)"/>
  <circle cx="982" cy="506" r="5.5" fill="none" stroke="#E8943A" stroke-width="2.6" filter="url(#softGlow)"/>

  <!-- active node where source meets Q (series particle motif) -->
  <circle cx="748" cy="688" r="7" fill="#04ECF6" filter="url(#cyanGlow)"/>
  <g filter="url(#softGlow)">
    <circle cx="724" cy="672" r="2.4" fill="#E8943A"/>
    <circle cx="712" cy="700" r="2" fill="#04ECF6"/>
    <circle cx="700" cy="660" r="1.7" fill="#E8943A"/>
    <circle cx="690" cy="690" r="2.2" fill="#04ECF6"/>
    <circle cx="734" cy="706" r="1.8" fill="#E8943A"/>
    <circle cx="676" cy="674" r="1.5" fill="#04ECF6"/>
    <circle cx="708" cy="716" r="1.5" fill="#E8943A"/>
    <circle cx="664" cy="694" r="1.4" fill="#2FD4E0"/>
  </g>

  <!-- diagram labels -->
  <text x="246" y="448" font-size="30" fill="#04ECF6" font-style="italic" filter="url(#softGlow)">Q</text>
  <text x="840" y="474" font-size="19" letter-spacing="3" fill="#E8943A">SOURCE TERM</text>
  <text x="784" y="884" font-size="17" letter-spacing="2.5" fill="#7E8A9A">OUTSIDE THE</text>
  <text x="784" y="908" font-size="17" letter-spacing="2.5" fill="#7E8A9A">CONTROL SET</text>
  <text x="252" y="894" font-size="17" letter-spacing="2.5" fill="#5C6B7E">UNDER THE OBJECTIVE</text>
</svg>
